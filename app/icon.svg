<svg width="512" height="512" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="100" height="100" rx="20" fill="#e81c4c" />
  
  <!-- Outer wifi wave -->
  <path d="M 15 35 A 45 45 0 0 1 85 35" stroke="#ffffff" stroke-width="10" stroke-linecap="round" />
  
  <!-- Inner wifi wave -->
  <path d="M 28 50 A 28 28 0 0 1 72 50" stroke="#ffffff" stroke-width="10" stroke-linecap="round" />
  
  <!-- Coin circle -->
  <circle cx="50" cy="70" r="18" fill="#ffffff" />
  <circle cx="50" cy="70" r="14" stroke="#e81c4c" stroke-width="1.5" fill="#ffffff" />
  
  <!-- Dollar symbol -->
  <text x="50" y="76" text-anchor="middle" fill="#e81c4c" font-size="16" font-weight="800" font-family="sans-serif">$</text>
</svg>
